name: Publicar release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install innosetup --no-progress -y
      - name: Comprobar versión
        shell: pwsh
        run: |
          $v=(Select-String 'version = "(.+)"' Cargo.toml).Matches[0].Groups[1].Value
          if ("v$v" -ne '${{ github.ref_name }}') { throw 'La etiqueta no coincide con Cargo.toml' }
      - run: .\build.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HyperXBatteryTray.exe
            dist/hyperx-probe.exe
            dist/HyperXBatteryTray-Setup-*.exe
            dist/SHA256SUMS.txt
