[package]
name = "hyperx-battery-tray"
version = "0.1.0"
edition = "2021"
authors = ["GuacamoleGH"]
license = "MIT"
repository = "https://github.com/GuacamoleGH/HyperX-Battery-Tray"
description = "System tray battery indicator for HyperX Cloud III S Wireless"
autobins = false

[lib]
name = "hyperx_battery"
path = "src/lib.rs"

[[bin]]
name = "HyperXBatteryTray"
path = "src/main.rs"

[[bin]]
name = "hyperx-probe"
path = "src/bin/probe.rs"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
